function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }

function fmtDate(d){
  d = new Date(d);

function fmtDateTime(d){
  d = new Date(d);

function nowISO(){ return new Date().toISOString(); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- Amortización (sistema francés / cuota fija) ---------- */
function calcCuota(principal, tasaAnualPct, meses){
  const r = (tasaAnualPct/100)/12;
  if (r === 0) return principal/meses;
  return principal * r / (1 - Math.pow(1+r, -meses));
}
function buildSchedule(principal, tasaAnualPct, meses, startDate){
  const r = (tasaAnualPct/100)/12;
  const cuota = calcCuota(principal, tasaAnualPct, meses);
  let saldo = principal;
  const rows = [];
  let d = new Date(startDate || Date.now());
  for(let i=1;i<=meses;i++){
    const interes = saldo*r;
    let capital = cuota - interes;
    if (i === meses) capital = saldo;
    saldo = Math.max(0, saldo - capital);
    d = new Date(d); d.setMonth(d.getMonth()+1);
    rows.push({n:i, fecha:new Date(d), cuota:(capital+interes), interes, capital, saldo});
  }
  return {cuota, rows};
}
function loanExpectedInstallments(loan){
  if(loan.status!=='activo' && loan.status!=='pagado') return 0;
  if(!loan.approvedAt) return 0;
  const start = new Date(loan.approvedAt);
  const now = new Date();
  let months = (now.getFullYear()-start.getFullYear())*12 + (now.getMonth()-start.getMonth());
  if(now.getDate() < start.getDate()) months -= 1;
  months = Math.max(0, Math.min(months, loan.term));
  return months;
}
function loanCuotasAtrasadas(loan){ return Math.max(0, loanExpectedInstallments(loan) - loan.payments.length); }

/* ---------- Firestore: sincronización de datos en la nube ---------- */
let DB = {users:[], accounts:[], loans:[], transactions:[], settings:{}, tickets:[], visitNotes:[], invoices:[], vouchers:[]};
let dbReady = false;
let authResolved = false;
let fbUser = null;
const dbLoadedFlags = {};

// Llave del documento de Firestore para cada registro. Para "users" se usa el UID
// de Firebase Authentication (lo exige la regla de seguridad, que necesita poder hacer
// get(/users/$(request.auth.uid)) para saber el rol de quien pide o escribe algo).
// Para el resto de colecciones se usa el mismo "id" interno que ya generaba la app.
function docKeyOf(name, item){
  if(name==='users' && item && item.uid) return item.uid;
  return item && item.id;
}
let lastKnown = {}; // última versión conocida de cada colección, por llave de documento — para no reescribir lo que no cambió
function writeSettings(){
  return fs.collection(META_COLLECTION).doc('settings').set(DB.settings);
}
function saveDB(){
  writeSettings().catch(err=>{
    console.error('Error guardando settings', err);
    showToast('No se pudo guardar la configuración: '+(err&&err.message?err.message:'error'), true);
  });
  ARRAY_COLLECTIONS.forEach(name=>{
    const current = DB[name] || [];
    const prevMap = lastKnown[name] || {};
    const prevKeys = new Set(Object.keys(prevMap));
    const batch = fs.batch();
    let hasOps = false;
    current.forEach(item=>{
      const key = docKeyOf(name, item);
      if(!key) return;
      const prevItem = prevMap[key];
      if(!prevItem || JSON.stringify(prevItem) !== JSON.stringify(item)){
        batch.set(fs.collection(name).doc(key), item);
        hasOps = true;
      }
      prevKeys.delete(key);
    });
    prevKeys.forEach(key=>{
      batch.delete(fs.collection(name).doc(key));
      hasOps = true;
    });
    if(hasOps){
      batch.commit().catch(err=>{
        console.error('Error guardando '+name, err);
        showToast('No se pudo guardar ('+name+'): '+(err&&err.message?err.message:'error'), true);
      });
    }
  });
}
function migrateSettingsDefaults(){
  if(!DB.settings) DB.settings = {};
  if(!DB.settings.usdToHnl) DB.settings.usdToHnl = 26.75;
  if(!DB.settings.updatedAt) DB.settings.updatedAt = nowISO();
  if(!DB.settings.voucherConfig) DB.settings.voucherConfig = {prefixIngreso:'ING', prefixEgreso:'EGR', prefixTransferencia:'TRF', nextIngreso:1, nextEgreso:1, nextTransferencia:1};
  if(!DB.settings.voucherConfig.prefixTransferencia){ DB.settings.voucherConfig.prefixTransferencia='TRF'; DB.settings.voucherConfig.nextTransferencia=1; }
  if(!DB.settings.printerConfig) DB.settings.printerConfig = {width:'58'};
  applyTheme();
}
let docExisted = {};
async function seedIfEmpty(){
  // "settings" es lo primero que se escribe siempre al sembrar datos, y lo único que se
  // puede leer sin sesión — por eso basta con mirar si existe para saber si la base está vacía.
  if(docExisted['settings']) return;
  if(fbUser && myRole === 'cliente') return; // un cliente nunca debe intentar sembrar datos
  showToast('Preparando datos de demostración por primera vez (puede tardar unos segundos)…');
  const seed = seedDB();
  // Crea las cuentas reales de Firebase Authentication para los usuarios de demostración
  // y guarda el UID de Firebase en cada una (es la llave del documento en "users").
  const fallos = [];
  for(const u of seed.users){
    try{
      u.uid = await createFirebaseAccount(u.username, u.password);
    }catch(e){
      console.error('No se pudo crear la cuenta de demostración para '+u.username, e);
      fallos.push(u.username+' ('+(e&&e.code?e.code:(e&&e.message)||'error')+')');
    }
    delete u.password;
  }
  for(const name of ARRAY_COLLECTIONS){
    const batch = fs.batch();
    (seed[name]||[]).forEach(item=>{
      const key = docKeyOf(name, item);
      if(key) batch.set(fs.collection(name).doc(key), item);
    });
    await batch.commit();
  }
  await fs.collection(META_COLLECTION).doc('settings').set(seed.settings);
  if(fallos.length){
    showToast('Atención: no se pudieron crear estas cuentas de demostración: '+fallos.join(', ')+'. Su perfil quedó sin UID — no podrán iniciar sesión hasta crearlas de nuevo.', true);
  } else {
    showToast('Datos de demostración listos. Ya puedes iniciar sesión.');
  }
}
function maybeRenderAfterInit(){ if(authResolved && dbReady) render(); }
let dbConnectionErrors = {};
let myRole = null;
let requiredKeys = [];
let unsubs = [];
function detachAll(){ unsubs.forEach(function(u){ try{ u(); }catch(e){} }); unsubs = []; }
function markLoaded(key){ dbLoadedFlags[key] = true; afterDocLoaded(); }
let roleResolving = false;
function afterDocLoaded(){
  if(!dbReady){
    if(!roleResolving && requiredKeys.length && requiredKeys.every(function(k){ return dbLoadedFlags[k]; })){
      dbReady = true;
      seedIfEmpty().then(maybeRenderAfterInit);
    } else {
      render();
    }
  } else {
    render();
  }
}
function attachCollection(key, dbField, queryRef){
  const unsub = queryRef.onSnapshot(function(qs){
    delete dbConnectionErrors[key];
    docExisted[key] = !qs.empty;
    const map = {};
    qs.forEach(function(doc){ map[doc.id] = doc.data(); });
    lastKnown[dbField] = map;
    DB[dbField] = Object.values(map);
    markLoaded(key);
  }, function(err){
    console.error('Firestore ('+key+')', err);
    dbConnectionErrors[key] = (err && err.code) ? err.code : (err && err.message) || 'error desconocido';
    render();
  });
  unsubs.push(unsub);
}
function attachSettingsDoc(){
  const unsub = fs.collection(META_COLLECTION).doc('settings').onSnapshot(function(snap){
    delete dbConnectionErrors['settings'];
    docExisted['settings'] = snap.exists;
    DB.settings = snap.exists ? snap.data() : {};
    migrateSettingsDefaults();
    markLoaded('settings');
  }, function(err){
    console.error('Firestore (settings)', err);
    dbConnectionErrors['settings'] = (err && err.code) ? err.code : (err && err.message) || 'error desconocido';
    render();
  });
  unsubs.push(unsub);
}
let clientTxUnsub = null;
function attachClientTransactions(myUid){
  const myAcc = accountByUser(myUid);
  if(clientTxUnsub){ clientTxUnsub(); clientTxUnsub = null; }
  if(!myAcc){ DB.transactions = []; markLoaded('transactions'); return; }
  clientTxUnsub = fs.collection('transactions').where('accountId','==', myAcc.id).onSnapshot(function(qs){
    delete dbConnectionErrors['transactions'];
    const map = {};
    qs.forEach(function(doc){ map[doc.id] = doc.data(); });
    lastKnown['transactions'] = map;
    DB.transactions = Object.values(map);
    markLoaded('transactions');
  }, function(err){
    dbConnectionErrors['transactions'] = (err && err.code) ? err.code : (err && err.message) || 'error desconocido';
    render();
  });
  unsubs.push(clientTxUnsub);
}
function waitForAccountsThen(fn){
  if(dbLoadedFlags['accounts']) fn();
  else setTimeout(function(){ waitForAccountsThen(fn); }, 150);
}
function startDataSync(){
  detachAll();
  dbReady = false;
  Object.keys(dbLoadedFlags).forEach(function(k){ delete dbLoadedFlags[k]; });
  dbConnectionErrors = {};
  myRole = null;
  DB.users=[]; DB.accounts=[]; DB.loans=[]; DB.transactions=[]; DB.tickets=[]; DB.visitNotes=[]; DB.invoices=[]; DB.vouchers=[];

  attachSettingsDoc();

  if(!fbUser){
    requiredKeys = ['settings'];
    roleResolving = false;
    return;
  }

  // Mientras no sepamos el rol, ninguna llave "requerida" debe poder darse por cumplida
  // (si no, una colección rápida como "settings" podría marcar la app como "lista" antes
  // de tiempo y mostrar por un instante la pantalla de "perfil no encontrado").
  requiredKeys = [];
  roleResolving = true;

  fs.collection('users').doc(fbUser.uid).get().then(function(snap){
    myRole = snap.exists ? (snap.data().role || 'cliente') : 'cliente';
    attachCollection('users', 'users', fs.collection('users'));
    attachCollection('accounts', 'accounts', fs.collection('accounts'));
    if(myRole === 'cliente'){
      requiredKeys = ['users','accounts','loans','transactions','vouchers','settings'];
      attachCollection('loans', 'loans', fs.collection('loans').where('userId','==', fbUser.uid));
      attachCollection('vouchers', 'vouchers', fs.collection('vouchers').where('clientId','==', fbUser.uid));
      waitForAccountsThen(function(){ attachClientTransactions(fbUser.uid); });
    } else {
      requiredKeys = ['users','accounts','loans','transactions','tickets','visitNotes','invoices','vouchers','settings'];
      attachCollection('loans', 'loans', fs.collection('loans'));
      attachCollection('transactions', 'transactions', fs.collection('transactions'));
      attachCollection('tickets', 'tickets', fs.collection('tickets'));
      attachCollection('visitNotes', 'visitNotes', fs.collection('visitNotes'));
      attachCollection('invoices', 'invoices', fs.collection('invoices'));
      attachCollection('vouchers', 'vouchers', fs.collection('vouchers'));
    }
    roleResolving = false;
    afterDocLoaded();
  }).catch(function(err){
    console.error('No se pudo leer el perfil propio', err);
    dbConnectionErrors['users'] = (err && err.code) ? err.code : (err && err.message) || 'error desconocido';
    roleResolving = false;
    render();
  });
}

/* ---------- Guardar / compartir archivos (capacidad "downloads", con respaldo local) ---------- */
async function saveFile(filename, blob){
  try{
    if(window.claude && window.claude.use){
      const downloads = await window.claude.use('downloads');
      if(downloads){
        const result = await downloads.save({filename, data:blob});
        showToast(result && result.status==='delivered' ? 'Archivo enviado.' : 'Archivo guardado correctamente.');
        return;
      }
    }
  }catch(e){
    const code = e && e.code;
    if(code==='declined'){ return; }
    if(code==='rejected_extension' || code==='extension_not_enabled'){ showToast('Ese formato de archivo no está permitido aquí.', true); return; }
    // cualquier otro error: intentamos la descarga clásica del navegador como respaldo
  }
  try{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    showToast('Archivo descargado.');
  }catch(e2){
    showToast('No se pudo guardar el archivo. Inténtalo de nuevo.', true);
  }
}
function downloadCSV(filename, rows){
  const csv = rows.map(r => r.map(c => {
    c = String(c==null?'':c);
    return /[",\n]/.test(c) ? '"'+c.replace(/"/g,'""')+'"' : c;
  }).join(',')).join('\n');
  const blob = new Blob(["\uFEFF"+csv], {type:'text/csv;charset=utf-8;'});
  saveFile(filename, blob);
}


/* ---------- Impresión ---------- */
function printHTML(html){
  const area = document.getElementById('printArea');
  area.innerHTML = html + '<div class="print-screen-note" style="text-align:center; font:12px sans-serif; color:#888; padding:16px;">Si no se abrió el cuadro de impresión, toca la pantalla para volver.</div>';
  document.body.classList.add('printing');
  // Respaldo forzado: además de las reglas @media print, ocultamos con estilo
  // en línea cualquier otro hijo directo de <body> (modales, toasts, la app),
  // para que nunca se filtre texto detrás del recibo al imprimir.
  const hidden = [];
  Array.from(document.body.children).forEach(el=>{
    if(el !== area){
      hidden.push([el, el.style.display]);
      el.style.display = 'none';
    }
  });
  area.style.display = 'block';
  let restored = false;
  const gestureEvents = ['pointerdown','touchstart','keydown'];
  const restore = ()=>{
    if(restored) return;
    restored = true;
    hidden.forEach(([el,d])=>{ el.style.display = d; });
    area.style.display = '';
    document.body.classList.remove('printing');
    window.removeEventListener('afterprint', restore);
    gestureEvents.forEach(ev=>document.removeEventListener(ev, restore, true));
  };
  window.addEventListener('afterprint', restore);
  // Si el visor no puede abrir el cuadro de impresión (p. ej. dentro de otra app),
  // el usuario vuelve tocando la pantalla. Esperamos un momento para no capturar el mismo toque.
  setTimeout(()=>{ if(!restored) gestureEvents.forEach(ev=>document.addEventListener(ev, restore, true)); }, 700);
  try{
    window.print();
  }catch(e){
    restore();
    showToast('Este visor no permite abrir el cuadro de impresión. Abre la aplicación en Chrome e inténtalo de nuevo.', true);
  }
}

/* ---------- PDF (jsPDF) ---------- */
function hexToRgbArr(hex){ const c=hexToRgb(hex); return [c.r,c.g,c.b]; }
function buildStatementDoc(d){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const pageWidth = 210, pageHeight = 297, marginX = 14, maxY = 268;
  const primary = hexToRgbArr(DB.settings.primaryColor || '#1E2A38');
  const gold = hexToRgbArr(DB.settings.goldColor || '#C9A227');
  const zebra = hexToRgbArr(lighten(DB.settings.goldColor || '#C9A227', 0.9));
  const logo = DB.settings.logoDataUrl;
  const canEmbedLogo = logo && typeof logo === 'string' && logo.indexOf('data:image') === 0;

  function drawBand(full){
    const bandH = full ? 34 : 20;
    doc.setFillColor(primary[0],primary[1],primary[2]);
    doc.rect(0,0,pageWidth,bandH,'F');
    let logoDrawn = false;
    if(full && canEmbedLogo){
      try{
        const fmt = logo.indexOf('image/png')>-1 ? 'PNG' : (logo.indexOf('image/jpeg')>-1||logo.indexOf('image/jpg')>-1 ? 'JPEG' : 'PNG');
        doc.addImage(logo, fmt, marginX, 8, 18, 18);
        logoDrawn = true;
      }catch(e){}
    }
    const textX = logoDrawn ? marginX+24 : marginX;
    doc.setTextColor(255,255,255);
    doc.setFont('helvetica','bold'); doc.setFontSize(full?16:12);
    doc.text(String(companyName()), textX, full?16:12.5);
    if(full){
      doc.setFont('helvetica','normal'); doc.setFontSize(9);
      let infoY = 23;
      companyInfoLines().forEach(line=>{ doc.text(String(line), textX, infoY); infoY += 4.5; });
    }
    return bandH;
  }

  let y = drawBand(true) + 12;
  doc.setTextColor(gold[0],gold[1],gold[2]);
  doc.setFont('helvetica','bold'); doc.setFontSize(14);
  doc.text(String(d.title), marginX, y); y += 3;
  doc.setDrawColor(gold[0],gold[1],gold[2]); doc.setLineWidth(0.6);
  doc.line(marginX, y, pageWidth-marginX, y); y += 8;

  doc.setTextColor(45,45,45);
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  d.infoLines.forEach(line=>{ doc.text(String(line), marginX, y); y += 5.5; });
  y += 5;

  const headers = d.headers;
  const colWidth = (pageWidth-marginX*2)/headers.length;
  function drawHeaderRow(){
    doc.setFillColor(primary[0],primary[1],primary[2]);
    doc.rect(marginX, y-4.6, pageWidth-marginX*2, 7, 'F');
    doc.setTextColor(255,255,255);
    doc.setFont('helvetica','bold'); doc.setFontSize(9);
    let x=marginX+2;
    headers.forEach(h=>{ doc.text(String(h), x, y); x+=colWidth; });
    y += 6.2;
    doc.setFont('helvetica','normal');
    doc.setTextColor(45,45,45);
  }
  function newPage(){
    doc.addPage();
    y = drawBand(false) + 12;
    drawHeaderRow();
  }
  drawHeaderRow();
  let rowIndex = 0;
  d.rows.forEach(row=>{
    if(y>maxY){ newPage(); rowIndex=0; }
    if(rowIndex % 2 === 1){
      doc.setFillColor(zebra[0],zebra[1],zebra[2]);
      doc.rect(marginX, y-4.2, pageWidth-marginX*2, 5.6, 'F');
    }
    let x=marginX+2;
    row.forEach(cell=>{ doc.text(String(cell), x, y); x+=colWidth; });
    y += 5.6;
    rowIndex++;
  });

  const totalPages = doc.internal.getNumberOfPages();
  for(let p=1; p<=totalPages; p++){
    doc.setPage(p);
    doc.setDrawColor(primary[0],primary[1],primary[2]); doc.setLineWidth(0.4);
    doc.line(marginX, pageHeight-16, pageWidth-marginX, pageHeight-16);
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(130,130,130);
    doc.text(String(companyName())+' · Generado el '+fmtDate(new Date()), marginX, pageHeight-11);
    doc.text('Página '+p+' de '+totalPages, pageWidth-marginX, pageHeight-11, {align:'right'});
  }
  return doc;
}
function pdfFromStatement(d){
  try{
    if(!window.jspdf){ showToast('El generador de PDF no cargó; verifica tu conexión e inténtalo de nuevo.', true); return; }
    const doc = buildStatementDoc(d);
    const blob = doc.output('blob');
    saveFile(d.filename, blob);
  }catch(e){ showToast('No se pudo generar el PDF.', true); }
}
function shareFromStatement(d){ pdfFromStatement(d); }

/* =========================================================
   RENDER — un único dashboard por rol
   ========================================================= */
function render(){
  const scrollY = window.scrollY;
  const app = document.getElementById('app');

  if(!authResolved || !dbReady){ app.innerHTML = renderLoadingScreen(); return; }

  const user = currentUser();

  if(STATE.screen === 'guest-simulador'){ app.innerHTML = renderGuestSimShell(); return; }
  if(fbUser && !user){ app.innerHTML = renderProfileMismatchScreen(); return; }
  if(STATE.screen === 'login'){ app.innerHTML = renderLogin(); return; }
  if(!user){ STATE.screen='login'; app.innerHTML = renderLogin(); return; }

  const map = sectionMapFor(user.role);
  const active = getActiveSection(user.role);
  const body = `<section id="${active}" class="section-block">${map[active]()}</section>`;

  app.innerHTML = renderShell(user, body, active);
  window.scrollTo(0, scrollY);

  const t = STATE.toast;
  if(t){
    const div = document.createElement('div');
    div.id='toastEl'; div.className='toast'+(t.isErr?' err':'');
    div.textContent = t.msg;
    document.body.appendChild(div);
  }
}
function sectionMapFor(role){
  if(role==='admin') return {
    'sec-resumen': renderAdminResumenSection,
    'sec-solicitudes': renderAdminSolicitudesSection,
    'sec-tickets': renderAdminTicketsSection,
    'sec-facturas': renderFacturasSection,
    'sec-usuarios': renderAdminUsuariosSection,
    'sec-buscar': renderBuscarClientesSection,

    'sec-simulador': renderSimuladorSection,

  if(role==='cajero') return {
    'sec-transacciones': renderCajaTransaccionesSection,
    'sec-solicitudes': renderCajaSolicitudesSection,
    'sec-pagos': renderCajaPagosSection,
    'sec-facturas': renderFacturasSection,
    'sec-clientes': renderCajaClientesSection,
    'sec-buscar': renderBuscarClientesSection,
    'sec-historial': renderHistorialSection,
    'sec-simulador': renderSimuladorSection,
    'sec-impresoras': renderImpresorasSection,
  };
  if(role==='cobrador') return {
    'sec-tickets-cobro': ()=>renderCobradorTicketsSection(currentUser()),

    'sec-historial': renderHistorialSection,

  };
  return {
    'sec-cuenta': ()=>renderClienteCuentaSection(currentUser()),

    'sec-prestamos': ()=>renderClientePrestamosSection(currentUser()),

    'sec-perfil': ()=>renderClientePerfilSection(currentUser()),
  };
}
function getActiveSection(role){
  const map = sectionMapFor(role);
  const keys = Object.keys(map);
  return (STATE.activeSection && map[STATE.activeSection]) ? STATE.activeSection : keys[0];
}
function selectSection(id){
  STATE.activeSection = id;

  if(isMobile) STATE.sidebarHidden = true;
  render();
  window.scrollTo(0,0);
}
function countPendingInvoicesForCollector(collectorId){
  const clientIds = new Set(ticketsForCollector(collectorId).map(t=>t.clientId));
  return DB.invoices.filter(i=>i.status==='habilitada' && clientIds.has(i.clientId)).length;
}
function countHabilitadaInvoices(){ return DB.invoices.filter(i=>i.status==='habilitada').length; }

/* ---------- Numeración de comprobantes (ingreso / egreso / transferencia) ---------- */
function voucherKindForType(type){ return type==='retiro' ? 'egreso' : 'ingreso'; }
function voucherKindLabel(kind){
  if(kind==='egreso') return 'Egreso';
  if(kind==='transferencia') return 'Transferencia';
  return 'Ingreso';
}
function nextVoucherNumber(kind){
  const cfg = DB.settings.voucherConfig;
  if(!cfg) return null;
  const prefixKey = kind==='egreso' ? 'prefixEgreso' : (kind==='transferencia' ? 'prefixTransferencia' : 'prefixIngreso');
  const nextKey = kind==='egreso' ? 'nextEgreso' : (kind==='transferencia' ? 'nextTransferencia' : 'nextIngreso');
  const prefix = cfg[prefixKey];
  const n = cfg[nextKey];
  const numero = prefix+'-'+String(n).padStart(6,'0');
  cfg[nextKey] = n+1;
  saveDB();
  return {numero, kind};
}
function voucherLines(voucher){
  if(!voucher) return [];
  return ['Comprobante de '+voucherKindLabel(voucher.kind)+' N.° '+voucher.numero];
}

function renderShell(user, body, active){
  const groups = navFor(user.role);
  const navGroupsHtml = groups.map((g, gi)=>{
    const gkey = 'g'+gi;
    const collapsed = !!STATE.navCollapsed[gkey];
    const itemsHtml = g.items.map(([key,label,badge])=>
      `<button class="${key===active?'active':''}" onclick="selectSection('${key}')"><span class="navlabel"><span class="navdot"></span>${esc(label)}</span>${badge?`<span class="nav-badge">${badge}</span>`:''}</button>`
    ).join('');
    return `<div class="nav-group ${collapsed?'collapsed':''}">
      <button class="nav-group-header" onclick="toggleNavGroup('${gkey}')"><span>${esc(g.group)}</span><span class="chev">▾</span></button>
      <ul class="navlist">${itemsHtml}</ul>
    </div>`;
  }).join('');

  const acc = user.role==='cliente' ? accountByUser(user.id) : null;

  return `
  <header class="appheader">
    <div class="appheader-left">
      <button class="hide-btn" onclick="toggleSidebar()" aria-label="Menú">☰</button>
      ${brandMarkHTML('brand-mark-sm')}
      <div class="appheader-brand">${esc(companyName())}</div>
    </div>
    <div class="appheader-right">
      <span class="userchip-inline">
        <b>${esc(user.name)}</b>
        <span>${esc(roleLabel(user.role))}${user.role==='cliente'?(' · Cuenta '+(acc?esc(acc.accountNumber):'—')):''}</span>
      </span>
      <button class="logout-btn-sm" onclick="logout()">Salir</button>
    </div>
  </header>
  <div class="shell ${STATE.sidebarHidden?'sidebar-hidden':'sidebar-shown'}">
    ${STATE.sidebarHidden?'':'<div class="sidebar-backdrop" onclick="toggleSidebar()"></div>'}
    <aside class="sidebar">${navGroupsHtml}</aside>
    <main class="main">${body}</main>
  </div>`;
}

function renderAdminResumenSection(){
  const totalAhorros = DB.accounts.reduce((s,a)=>s+a.balance,0);
  const carteraActiva = DB.loans.filter(l=>l.status==='activo').reduce((s,l)=>s+l.balance,0);
  const pendientes = DB.loans.filter(l=>l.status==='pendiente').length;
  const totalClientes = clientUsers().length;

  const counts = {pendiente:0, activo:0, pagado:0, rechazado:0};
  DB.loans.forEach(l=>counts[l.status]=(counts[l.status]||0)+1);
  const maxCount = Math.max(1,...Object.values(counts));
  const colors = {pendiente:'var(--gold)', activo:'var(--success)', pagado:'#8791A6', rechazado:'var(--danger)'};
  const labels = {pendiente:'Pendientes', activo:'Activos', pagado:'Pagados', rechazado:'Rechazados'};
  const recentTx = DB.transactions.slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,6);

  return `
  <div class="topline">
    <div><h1>Resumen general</h1><div class="sub">Vista consolidada de la cooperativa</div></div>
    <button class="btn btn-outline btn-sm" onclick="downloadCSV('reporte_cofradia.csv', buildReportRows())">Descargar reporte CSV</button>
  </div>

  <div class="grid grid-4">
    <div class="card kpi"><div class="label">Total en ahorros</div><div class="value">${money(totalAhorros)}</div></div>
    <div class="card kpi"><div class="label">Cartera de préstamos activa</div><div class="value gold">${money(carteraActiva)}</div></div>
    <div class="card kpi"><div class="label">Solicitudes pendientes</div><div class="value ${pendientes?'danger':''}">${pendientes}</div></div>
    <div class="card kpi"><div class="label">Clientes registrados</div><div class="value">${totalClientes}</div></div>
  </div>

  <div class="section-title">Tipo de cambio<div class="rule"></div></div>
  <div class="card" style="max-width:420px;">
    <div class="muted" style="font-size:12.5px; margin-bottom:10px;">
      1 USD = ${DB.settings.usdToHnl.toFixed(4)} HNL &nbsp;·&nbsp; 1 HNL = ${(1/DB.settings.usdToHnl).toFixed(4)} USD
      <br>Actualizado: ${fmtDate(DB.settings.updatedAt)}
    </div>
    <div style="display:flex; gap:10px; align-items:flex-end;">
      <div class="field" style="margin-bottom:0; flex:1;"><label>Lempiras por 1 USD</label><input id="fxRate" type="number" min="0" step="0.0001" value="${DB.settings.usdToHnl}"></div>
      <button class="btn btn-outline btn-sm" onclick="updateExchangeRate()">Actualizar</button>
    </div>
  </div>

  <div class="section-title">Cartera de préstamos por estado<div class="rule"></div></div>
  <div class="card">
    <div class="barchart">
      ${Object.keys(labels).map(k=>`
        <div class="barrow">
          <div>${labels[k]}</div>
          <div class="bartrack"><div class="barfill" style="width:${(counts[k]/maxCount*100)}%; background:${colors[k]};"></div></div>
          <div class="num" style="text-align:right;">${counts[k]}</div>
        </div>`).join('')}
    </div>
  </div>

  <div class="section-title">Movimientos recientes<div class="rule"></div></div>
  <div class="tablewrap">
    <table>
      <tr><th>Fecha</th><th>Cliente</th><th>Tipo</th><th>Monto</th><th>Cajero</th></tr>

function hexToRgb(hex){
  hex = (hex||'').replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  const n = parseInt(hex,16);
  return {r:(n>>16)&255, g:(n>>8)&255, b:n&255};
}
function lighten(hex, amt){
  const {r,g,b} = hexToRgb(hex);
  const mix = (c)=>Math.round(c + (255-c)*amt);
  return '#' + [mix(r),mix(g),mix(b)].map(v=>v.toString(16).padStart(2,'0')).join('');
}

window.__pendingLogoDataUrl = null;
function onLogoFileChosen(input){
  const note = document.getElementById('logoFileNote');
  const preview = document.getElementById('logoPreviewBox');
  window.__pendingLogoDataUrl = null;
  if(!input.files || !input.files[0]){ if(note) note.textContent=''; return; }
  const file = input.files[0];
  if(note) note.textContent = 'Procesando "'+file.name+'"…';
  resizeImageToDataUrl(file, 300, function(dataUrl){
    if(!dataUrl){
      if(note) note.textContent = 'No se pudo leer esta imagen. Prueba con otro archivo (JPG o PNG).';
      return;
    }
    window.__pendingLogoDataUrl = dataUrl;
    if(note) note.textContent = 'Imagen lista: "'+file.name+'". Presiona "Guardar cambios" para aplicarla.';
    if(preview) preview.innerHTML = `<img src="${dataUrl}" class="brand-mark" alt="Logo">`;
  });
}
function onLogoUrlTyped(url){
  const preview = document.getElementById('logoPreviewBox');
  url = (url||'').trim();
  if(!url){ window.__pendingLogoDataUrl = null; return; }
  window.__pendingLogoDataUrl = url;
  if(preview) preview.innerHTML = `<img src="${url}" class="brand-mark" alt="Logo" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'brand-mark',textContent:'?'}))">`;
}
function resizeImageToDataUrl(file, maxSize, callback){
  try{
    const reader = new FileReader();
    reader.onload = function(e){
      const rawDataUrl = e.target.result;
      try{
        const img = new Image();
        img.onload = function(){
          try{
            let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
            if(!w || !h){ callback(rawDataUrl); return; }
            const scale = Math.min(1, maxSize/Math.max(w,h));
            w = Math.max(1, Math.round(w*scale)); h = Math.max(1, Math.round(h*scale));
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            const resized = canvas.toDataURL('image/png');
            callback(resized);
          }catch(err){
            callback(rawDataUrl);
          }
        };
        img.onerror = function(){ callback(rawDataUrl); };
        img.src = rawDataUrl;
      }catch(err){
        callback(rawDataUrl);
      }
    };
    reader.onerror = function(){ callback(null); };
    reader.readAsDataURL(file);
  }catch(err){
    callback(null);
  }
}
function saveTheme(){
  try{
    const primary = document.getElementById('themePrimary').value;
    const gold = document.getElementById('themeGold').value;
    const font = document.getElementById('themeFont').value;
    const companyName_ = document.getElementById('themeCompanyName').value.trim() || 'Unión y Esfuerzo';
    const companyAddress_ = document.getElementById('themeCompanyAddress').value.trim();
    const companyPhone_ = document.getElementById('themeCompanyPhone').value.trim();
    const companyRTN_ = document.getElementById('themeCompanyRTN').value.trim();
    DB.settings.primaryColor = primary;
    DB.settings.goldColor = gold;
    DB.settings.systemFont = font;
    DB.settings.companyName = companyName_;
    DB.settings.companyAddress = companyAddress_;
    DB.settings.companyPhone = companyPhone_;
    DB.settings.companyRTN = companyRTN_;
    const cfg = DB.settings.voucherConfig;
    cfg.prefixIngreso = (document.getElementById('vchPrefixIng').value.trim() || 'ING').toUpperCase();
    cfg.prefixEgreso = (document.getElementById('vchPrefixEgr').value.trim() || 'EGR').toUpperCase();
    cfg.prefixTransferencia = (document.getElementById('vchPrefixTrf').value.trim() || 'TRF').toUpperCase();
    cfg.nextIngreso = Math.max(1, Number(document.getElementById('vchNextIng').value) || cfg.nextIngreso);
    cfg.nextEgreso = Math.max(1, Number(document.getElementById('vchNextEgr').value) || cfg.nextEgreso);
    cfg.nextTransferencia = Math.max(1, Number(document.getElementById('vchNextTrf').value) || cfg.nextTransferencia);
    if(window.__pendingLogoDataUrl) DB.settings.logoDataUrl = window.__pendingLogoDataUrl;
    try{
      saveDB();
    }catch(e){
      showToast('No se pudieron guardar los cambios: el logotipo es demasiado grande para el almacenamiento del navegador. Intenta con una imagen más pequeña.', true);
      return;
    }
    window.__pendingLogoDataUrl = null;
    applyTheme();
    showToast('Apariencia actualizada.');
    render();
  }catch(err){
    showToast('No se pudo guardar la apariencia: '+(err&&err.message?err.message:'error desconocido'), true);
  }
}

  auth.sendPasswordResetEmail(email).then(()=>{

function saveUserEdit(userId){
  const u = userById(userId);
  if(!u) return;
  const name = document.getElementById('euName').value.trim();
  const role = document.getElementById('euRole').value;
  if(!name){ showToast('El nombre es obligatorio.', true); return; }
  u.name=name; u.role=role;
  if(role==='cliente'){
    u.dni = document.getElementById('euDni').value.trim();
    u.fechaNacimiento = document.getElementById('euFecha').value;
    u.telefono = document.getElementById('euTelefono').value.trim();
    u.email = document.getElementById('euEmail').value.trim();
    u.direccion = document.getElementById('euDireccion').value.trim();
  }
  saveDB();
  showToast('Usuario actualizado.');

function deleteUser(userId){
  const u = userById(userId);
  if(!u) return;
  if(u.id===currentUser().id){ showToast('No puedes eliminar tu propio usuario mientras tienes la sesión activa.', true); return; }
  if(!confirm('¿Eliminar el perfil de "'+u.name+'"? Perderá acceso a la aplicación. Su cuenta de inicio de sesión seguirá existiendo en Firebase Authentication — bórrala ahí manualmente si quieres eliminarla por completo.')) return;
  DB.users = DB.users.filter(x=>x.id!==userId);
  saveDB();
  showToast('Perfil eliminado. El usuario ya no tiene acceso a la aplicación.');
  render();
}
function createUserAdmin(){
  const name = document.getElementById('nuName').value.trim();
  const username = document.getElementById('nuUser').value.trim();
  const password = document.getElementById('nuPass').value;
  const role = document.getElementById('nuRole').value;
  if(!name||!username||!password){ showToast('Completa todos los campos.', true); return; }
  if(password.length < 6){ showToast('La contraseña debe tener al menos 6 caracteres (requisito de Firebase).', true); return; }
  if(DB.users.some(u=>u.username===username)){ showToast('Ese correo ya está registrado.', true); return; }
  showToast('Creando usuario…');
  createFirebaseAccount(username, password).then(function(newUid){
    const id = newUid;
    const userObj = {id, uid:newUid, username, role, name, active:true};
    let extra = null;
    if(role==='cliente') extra = readClienteExtraFields('nu');
    if(extra) Object.assign(userObj, {dni:extra.dni, fechaNacimiento:extra.fechaNacimiento, telefono:extra.telefono, email:extra.email, direccion:extra.direccion});
    DB.users.push(userObj);
    if(role==='cliente'){
      const accId = uid('a');
      const bal = extra.balInicial;
      DB.accounts.push({id:accId, userId:id, balance:bal, openedAt:nowISO(), accountNumber:nextAccountNumber()});
      if(bal>0) DB.transactions.push({id:uid('t'), accountId:accId, type:'deposito', amount:bal, balanceAfter:bal, date:nowISO(), cajero:currentUser().username, nota:'Apertura de cuenta', voucher:nextVoucherNumber('ingreso')});
    }
    saveDB();
    showToast('Usuario creado correctamente.');
    render();
  }).catch(function(err){
    showToast('No se pudo crear el usuario: '+(err&&err.message?err.message:'error desconocido'), true);
  });
}

function lookupCajaTransDest(){

function doCajaTransfer(originUserId){
  const originAcc = accountByUser(originUserId);
  if(!originAcc){ showToast('Este cliente no tiene cuenta de ahorro.', true); return; }
  const destNum = document.getElementById('cajaTransDestino').value.trim();
  const destAcc = findAccountByNumber(destNum);
  if(!destAcc){ showToast('No se encontró ninguna cuenta con ese número.', true); return; }
  if(destAcc.id === originAcc.id){ showToast('La cuenta destino debe ser diferente a la de origen.', true); return; }
  const amount = Number(document.getElementById('cajaTransMonto').value);
  const desc = document.getElementById('cajaTransDesc').value.trim();
  if(!amount || amount<=0){ showToast('Ingresa un monto válido.', true); return; }
  if(amount > originAcc.balance){ showToast('Fondos insuficientes en la cuenta de origen.', true); return; }
  const originUser = userById(originUserId);
  const destUser = userById(destAcc.userId);
  originAcc.balance -= amount;
  destAcc.balance += amount;
  const cajeroName = currentUser().username;
  const voucherOrigen = nextVoucherNumber('egreso');
  const voucherDestino = nextVoucherNumber('transferencia');
  const tOrigen = {id:uid('t'), accountId:originAcc.id, type:'retiro', amount, balanceAfter:originAcc.balance, date:nowISO(), cajero:cajeroName, nota:'Transferencia a '+destUser.name+(desc?(': '+desc):''), voucher:voucherOrigen, cuentaOrigen:originAcc.accountNumber, cuentaDestino:destAcc.accountNumber};
  const tDestino = {id:uid('t'), accountId:destAcc.id, type:'deposito', amount, balanceAfter:destAcc.balance, date:nowISO(), cajero:cajeroName, nota:'Transferencia de '+originUser.name+(desc?(': '+desc):''), voucher:voucherDestino, cuentaOrigen:originAcc.accountNumber, cuentaDestino:destAcc.accountNumber};
  DB.transactions.push(tOrigen, tDestino);
  saveDB();
  showToast('Transferencia realizada: '+money(amount)+' de '+originUser.name+' a '+destUser.name+'.');
  showReceipt(tOrigen, originUser, ()=>showReceipt(tDestino, destUser));
  render();
}
function doTransaction(userId, type){
  const account = accountByUser(userId);
  const amount = Number(document.getElementById('txAmount').value);
  const note = document.getElementById('txNote').value.trim();
  if(!amount || amount<=0){ showToast('Ingresa un monto válido.', true); return; }
  if(type==='retiro' && amount > account.balance){ showToast('Fondos insuficientes para el retiro.', true); return; }
  account.balance += (type==='deposito' ? amount : -amount);
  const t = {id:uid('t'), accountId:account.id, type, amount, balanceAfter:account.balance, date:nowISO(), cajero:currentUser().username, nota:note, voucher:nextVoucherNumber(voucherKindForType(type))};
  DB.transactions.push(t);
  saveDB();
  showReceipt(t, userById(userId));
  render();
}

function escPosSafeText(s){
  return String(s)
    .replace(/°/g,'o').replace(/[—–]/g,'-').replace(/·/g,'-')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^\x00-\x7F]/g,'?');
}
function ticketPlainText(t, user){
  const w = printerWidthMm()==='80' ? 48 : 32;
  const center = x=>{ x=String(x); if(x.length>=w) return x; return ' '.repeat(Math.floor((w-x.length)/2))+x; };
  const sep = '-'.repeat(w);
  const lines = [];
  lines.push(center(companyName()));
  companyInfoLines().forEach(l=>lines.push(center(l)));
  lines.push(sep);
  if(t.voucher) lines.push(voucherKindLabel(t.voucher.kind)+' N. '+t.voucher.numero);
  lines.push('Cliente: '+user.name);
  lines.push('Operacion: '+opLabelFor(t));
  lines.push('Fecha: '+fmtDate(t.date));
  if(t.cuentaOrigen) lines.push('Cuenta origen: '+t.cuentaOrigen);
  if(t.cuentaDestino) lines.push('Cuenta destino: '+t.cuentaDestino);
  lines.push(sep);
  lines.push('Monto: '+money(t.amount));
  lines.push('Saldo: '+money(t.balanceAfter));
  lines.push(sep);
  lines.push('Atendido por: '+t.cajero);
  if(t.nota) lines.push('Nota: '+t.nota);
  lines.push(center(companyName()));
  return escPosSafeText(lines.join('\n'))+'\n\n\n';
}
function shareTicketText(t, user){

function rawbtUrl(t, user){

/* ---------- Impresión Bluetooth (impresoras térmicas ESC/POS) ---------- */
function buildEscPosReceipt(t, user){
  const opLabel = opLabelFor(t);
  const ESC = '\x1B';
  const lineLen = printerWidthMm()==='80' ? 48 : 32;
  const line = '-'.repeat(lineLen)+'\n';
  let out = ESC+'@';
  out += ESC+'a'+'\x01';
  out += companyName()+'\n';
  companyInfoLines().forEach(l=>out+=l+'\n');
  out += line;
  out += ESC+'a'+'\x00';
  if(t.voucher) out += voucherKindLabel(t.voucher.kind)+' N.: '+t.voucher.numero+'\n';
  out += 'Cliente: '+user.name+'\n';
  out += 'Operacion: '+opLabel+'\n';
  out += 'Fecha: '+fmtDate(t.date)+'\n';
  if(t.cuentaOrigen) out += 'Cuenta origen: '+t.cuentaOrigen+'\n';
  if(t.cuentaDestino) out += 'Cuenta destino: '+t.cuentaDestino+'\n';
  out += line;
  out += 'Monto: '+money(t.amount)+'\n';
  out += 'Saldo: '+money(t.balanceAfter)+'\n';
  out += line;
  out += 'Atendido por: '+t.cajero+'\n';
  voucherLines(t.voucher).forEach(l=>out+=l+'\n');
  out += '\n\n\n';
  return out;
}
function printReceiptBluetooth(t, user){
  const fallback = ()=>{
    showToast('Abriendo impresión estándar. En el cuadro que aparece, elige tu impresora Bluetooth de la lista (debe estar instalada como impresora del sistema, por ejemplo con la app RawBT).');
    printHTML(receiptPrintHTML(t, user));
  };
  if(!navigator.bluetooth){
    showToast('Este navegador no admite impresión Bluetooth directa (Web Bluetooth). Se abrirá la impresión estándar.', true);
    fallback();
    return;
  }
  const serviceUUID = '000018f0-0000-1000-8000-00805f9b34fb';
  const charUUID = '00002af1-0000-1000-8000-00805f9b34fb';
  const bytes = new TextEncoder().encode(buildEscPosReceipt(t, user));
  navigator.bluetooth.requestDevice({acceptAllDevices:true, optionalServices:[serviceUUID]})
    .then(device => {
      showToast('Conectando con "'+(device.name||'la impresora')+'"…');
      return device.gatt.connect();
    })
    .then(server => server.getPrimaryService(serviceUUID))
    .then(service => service.getCharacteristic(charUUID))
    .then(async characteristic => {
      const chunkSize = 180;
      for(let i=0;i<bytes.length;i+=chunkSize){
        await characteristic.writeValue(bytes.slice(i,i+chunkSize));
      }
      showToast('Enviado a la impresora Bluetooth correctamente.');
    })
    .catch(err=>{
      const name = err && err.name;
      if(name==='NotFoundError'){
        showToast('No se seleccionó ninguna impresora (o no se encontró ninguna compatible cerca).', true);
        return; // el usuario canceló el selector; no forzamos el respaldo
      }
      if(name==='NetworkError' || name==='NotSupportedError'){
        showToast('Esta impresora no admite impresión directa desde el navegador (usa Bluetooth clásico, no Bluetooth de baja energía). Necesitas una app como RawBT para poder imprimir. Se abrirá la impresión estándar.', true);
      } else {
        showToast('No se pudo conectar con la impresora Bluetooth ('+(name||'error desconocido')+'). Se abrirá la impresión estándar.', true);
      }
      fallback();
    });
}

function abonarCapital(loanId){
  const loan = DB.loans.find(l=>l.id===loanId);
  if(!loan) return;
  if(loanCuotasAtrasadas(loan)>0){ showToast('El cliente debe estar al día con los intereses antes de abonar a capital.', true); return; }
  const input = document.getElementById('capitalAbono_'+loanId);
  const amount = Number(input.value);
  if(!amount || amount<=0){ showToast('Ingresa un monto válido.', true); return; }
  const capital = Math.min(amount, loan.balance);
  loan.balance = Math.max(0, loan.balance - capital);
  loan.payments.push({date:nowISO(), cuota:capital, interes:0, capital, saldo:loan.balance, registradoPor:currentUser().username, tipo:'abono_capital'});
  if(loan.balance <= 0.5) loan.status='pagado';
  saveDB();
  showToast(loan.status==='pagado' ? 'Abono aplicado. ¡Préstamo liquidado!' : 'Abono a capital aplicado correctamente.');
  render();
}
function applyLoanPayment(loanId){
  const loan = DB.loans.find(l=>l.id===loanId);
  if(!loan) return null;
  const r = (loan.rate/100)/12;
  const cuota = calcCuota(loan.amount, loan.rate, loan.term);
  const interes = loan.balance*r;
  let capital = cuota - interes;
  if(capital > loan.balance) capital = loan.balance;
  loan.balance = Math.max(0, loan.balance - capital);
  const payment = {date:nowISO(), cuota:(capital+interes), interes, capital, saldo:loan.balance, registradoPor:currentUser().username};
  loan.payments.push(payment);
  if(loan.balance <= 0.5) loan.status='pagado';
  saveDB();
  return {loan, payment};
}

/* =========================================================
   HISTÓRICO DE COMPROBANTES (por mes, con reimpresión)
   ========================================================= */
function monthKeyOf(dateStr){
  const d = new Date(dateStr);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function monthLabelOf(key){
  const names = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const [y,m] = key.split('-');
  return names[Number(m)-1]+' de '+y;
}
function vouchersForRole(){
  const user = currentUser();
  let list = DB.vouchers.slice();
  if(user.role==='cobrador') list = list.filter(v=>v.cajero===user.username);
  else if(user.role==='cliente') list = list.filter(v=>v.clientId===user.id);
  return list;
}
function renderHistorialSection(){
  const vouchers = vouchersForRole().slice().sort((a,b)=>new Date(b.date)-new Date(a.date));
  const groups = {};
  vouchers.forEach(v=>{
    const key = monthKeyOf(v.date);
    if(!groups[key]) groups[key]=[];
    groups[key].push(v);
  });
  const monthKeys = Object.keys(groups).sort().reverse();
  const selMonth = (STATE.sel.historialMes && groups[STATE.sel.historialMes]) ? STATE.sel.historialMes : monthKeys[0];
  const rows = selMonth ? groups[selMonth] : [];
  const totalMes = rows.reduce((s,v)=>s + (v.voucher && v.voucher.kind==='egreso' ? -v.amount : v.amount), 0);
  return `
  <div class="topline"><div><h1>Histórico de comprobantes</h1><div class="sub">Consulta y reimprime cualquier comprobante agrupado por mes</div></div></div>
  ${monthKeys.length===0 ? `<div class="empty">Aún no se han generado comprobantes.</div>` : `
  <div class="card" style="margin-bottom:20px; max-width:360px;">
    <div class="field" style="margin-bottom:0;">
      <label>Mes</label>
      <select onchange="setSel('historialMes', this.value)">
        ${monthKeys.map(k=>`<option value="${k}" ${k===selMonth?'selected':''}>${monthLabelOf(k)} (${groups[k].length})</option>`).join('')}
      </select>
    </div>
  </div>
  <div class="grid grid-2" style="margin-bottom:18px;">
    <div class="card kpi"><div class="label">Comprobantes en ${monthLabelOf(selMonth)}</div><div class="value">${rows.length}</div></div>
    <div class="card kpi"><div class="label">Movimiento neto del mes</div><div class="value ${totalMes<0?'danger':''}">${money(totalMes)}</div></div>
  </div>
  <div class="tablewrap">
    <table>
      <tr><th>Fecha</th><th>Comprobante</th><th>Tipo</th><th>Cliente</th><th>Monto</th><th></th></tr>
      ${rows.map(v=>{
        const kind = v.voucher ? v.voucher.kind : null;
        const pillClass = kind==='egreso' ? 'rechazado' : (kind==='transferencia' ? 'pendiente' : 'activo');
        return `<tr>
          <td>${fmtDate(v.date)}</td>
          <td class="num">${v.voucher?esc(v.voucher.numero):'—'}</td>
          <td><span class="pill ${pillClass}">${v.voucher?esc(voucherKindLabel(v.voucher.kind)):'—'}</span></td>
          <td>${esc(v.clientName)}</td>
          <td class="num">${money(v.amount)}</td>
          <td><button class="btn btn-sm btn-outline" onclick="reprintVoucher('${v.id}')">Reimprimir</button></td>
        </tr>`;
      }).join('')}
    </table>
  </div>`}
  `;
}
function reprintVoucher(id){
  const v = DB.vouchers.find(x=>x.id===id);
  if(!v) return;
  const t = {type:v.type, amount:v.amount, balanceAfter:v.balanceAfter, date:v.date, cajero:v.cajero, nota:v.nota, voucher:v.voucher,
    cuentaOrigen:v.cuentaOrigen, cuentaDestino:v.cuentaDestino, __isReprint:true};
  showReceipt(t, {name:v.clientName});
}

function loanStatementData(loanId){
  const l = DB.loans.find(x=>x.id===loanId);
  const c = userById(l.userId);
  const cuota = calcCuota(l.amount, l.rate, l.term);
  const restanteMeses = Math.max(0, l.term-l.payments.length);
  let proyectado = [];
  if(restanteMeses>0 && l.status==='activo') proyectado = buildSchedule(l.balance, l.rate, restanteMeses, new Date()).rows;
  const rows = l.payments.map((p,i)=>[i+1, fmtDate(p.date), money(p.cuota), money(p.interes), money(p.capital), money(p.saldo)]);
  proyectado.forEach(r=>rows.push(['(proy.) '+(l.payments.length+r.n), fmtDate(r.fecha), money(r.cuota), money(r.interes), money(r.capital), money(r.saldo)]));

  bg.className='modal-bg'; bg.id='confirmPagoModalBg';
  bg.innerHTML = `<div class="modal">
    <h3 style="margin-bottom:10px;">Confirmar cobro de cuota</h3>
    <p class="muted" style="font-size:12.5px; margin-bottom:14px;">Verifica los datos antes de aplicar el pago en campo.</p>
    <div class="receipt">
      <div class="line"><span>Cliente</span><span>${esc(cliente.name)}</span></div>
      <div class="line"><span>Cuota N.°</span><span>${inv.cuotaNumero}</span></div>
      <hr>
      <div class="line"><span>Interés</span><span>${money(interes)}</span></div>
      <div class="line"><span>Capital</span><span>${money(capital)}</span></div>
      <div class="line"><span><b>Total a cobrar</b></span><span><b>${money(inv.monto)}</b></span></div>
      <hr>
      <div class="line"><span>Saldo actual</span><span>${money(loan.balance)}</span></div>
      <div class="line"><span>Saldo después del pago</span><span>${money(nuevoSaldo)}</span></div>
    </div>
    <div style="display:flex; gap:10px; margin-top:18px;">
      <button class="btn btn-outline" onclick="document.getElementById('confirmPagoModalBg').remove()">Cancelar</button>
      <button class="btn btn-gold" onclick="document.getElementById('confirmPagoModalBg').remove(); executeCollectorPayment('${invoiceId}')">Confirmar y cobrar</button>
    </div>
  </div>`;
  document.body.appendChild(bg);
}
function executeCollectorPayment(invoiceId){
  const inv = DB.invoices.find(i=>i.id===invoiceId);
  if(!inv || inv.status!=='habilitada') return;
  const res = applyLoanPayment(inv.loanId);
  if(!res) return;
  const user = currentUser();
  inv.status='pagada'; inv.paidAt=nowISO(); inv.paidBy=user.username;
  const ticket = DB.tickets.find(t=>t.clientId===inv.clientId && t.collectorId===user.id);
  DB.visitNotes.push({id:uid('vn'), clientId:inv.clientId, ticketId: ticket?ticket.id:null, collectorId:user.id, collectorName:user.name,
    text:'Pago de cuota #'+inv.cuotaNumero+' aplicado mediante factura habilitada: '+money(res.payment.cuota)+'.', type:'pago', timestamp:nowISO()});
  const voucher = nextVoucherNumber('ingreso');
  saveDB();
  showToast(res.loan.status==='pagado' ? 'Pago aplicado. ¡Préstamo liquidado!' : 'Pago aplicado correctamente.');
  showReceipt({type:'pago_prestamo', amount:res.payment.cuota, balanceAfter:res.loan.balance, date:res.payment.date, cajero:user.username, nota:'Pago de cuota #'+inv.cuotaNumero+' de préstamo (cobranza)', voucher}, userById(inv.clientId));
  render();
}
function closeTicket(ticketId){
  const t = DB.tickets.find(x=>x.id===ticketId);
  if(!t) return;
  t.status='completado'; t.closedAt=nowISO();
  saveDB(); showToast('Ticket marcado como completado.'); render();
}

function lookupDestAccount(){
  const val = document.getElementById('depDestino').value.trim();
  const span = document.getElementById('depDestNombre');
  if(!val){ span.innerHTML=''; return; }
  const acc = findAccountByNumber(val);
  const myAcc = accountByUser(currentUser().id);
  if(acc && myAcc && acc.id===myAcc.id){ span.innerHTML = '<span style="color:var(--danger);">Esa es tu propia cuenta</span>'; return; }
  if(acc){
    const u = userById(acc.userId);
    span.innerHTML = 'Beneficiario: <b style="color:var(--success);">'+esc(u.name)+'</b>';
  } else {
    span.innerHTML = '<span style="color:var(--danger);">No se encontró ninguna cuenta con ese número</span>';
  }
}
function doClientTransfer(){
  const user = currentUser();
  const myAcc = accountByUser(user.id);
  const destNum = document.getElementById('depDestino').value.trim();
  const destAcc = findAccountByNumber(destNum);
  if(!destAcc){ showToast('No se encontró ninguna cuenta con ese número.', true); return; }
  if(destAcc.id === myAcc.id){ showToast('No puedes depositar a tu propia cuenta.', true); return; }
  const amount = Number(document.getElementById('depMonto').value);
  const desc = document.getElementById('depDesc').value.trim();
  if(!amount || amount<=0){ showToast('Ingresa un monto válido.', true); return; }
  if(amount > myAcc.balance){ showToast('Fondos insuficientes.', true); return; }
  myAcc.balance -= amount;
  destAcc.balance += amount;
  const destUser = userById(destAcc.userId);
  const voucherOrigen = nextVoucherNumber('egreso');
  const voucherDestino = nextVoucherNumber('transferencia');
  const tOrigen = {id:uid('t'), accountId:myAcc.id, type:'retiro', amount, balanceAfter:myAcc.balance, date:nowISO(), cajero:'autoservicio', nota:'Transferencia a '+destUser.name+(desc?(': '+desc):''), voucher:voucherOrigen, cuentaOrigen:myAcc.accountNumber, cuentaDestino:destAcc.accountNumber};
  const tDestino = {id:uid('t'), accountId:destAcc.id, type:'deposito', amount, balanceAfter:destAcc.balance, date:nowISO(), cajero:'autoservicio', nota:'Transferencia de '+user.name+(desc?(': '+desc):''), voucher:voucherDestino, cuentaOrigen:myAcc.accountNumber, cuentaDestino:destAcc.accountNumber};
  DB.transactions.push(tOrigen, tDestino);
  saveDB();
  showToast('Depositaste '+money(amount)+' a la cuenta de '+destUser.name+'.');
  render();
  showReceipt(tOrigen, user, ()=>showReceipt(tDestino, destUser));
  const d1=document.getElementById('depDestino'), d2=document.getElementById('depMonto'), d3=document.getElementById('depDesc');
  if(d1)d1.value=''; if(d2)d2.value=''; if(d3)d3.value='';
}

      <button class="btn btn-outline btn" onclick="requestVerification('password')">Actualizar contraseña</button>
      <div class="muted" style="font-size:12px; margin-top:16px;">Por tu seguridad, todo cambio en tu perfil o contraseña requiere verificación mediante un código enviado a tu correo o teléfono.</div>
    </div>

function requestVerification(kind){
  const user = currentUser();
  let changes = {};
  if(kind==='perfil'){
    changes = {
      name: document.getElementById('pfName').value.trim(),
      direccion: document.getElementById('pfDireccion').value.trim(),
      telefono: document.getElementById('pfTelefono').value.trim(),
      email: document.getElementById('pfEmail').value.trim(),
    };
    if(!changes.name){ showToast('El nombre no puede estar vacío.', true); return; }
  } else {
    const p1 = document.getElementById('pfNewPass').value;
    const p2 = document.getElementById('pfNewPass2').value;
    if(!p1 || p1.length<4){ showToast('La contraseña debe tener al menos 4 caracteres.', true); return; }
    if(p1!==p2){ showToast('Las contraseñas no coinciden.', true); return; }
    changes = {password:p1};
  }
  openVerifyModal(kind, changes, user);
}
function openVerifyModal(kind, changes, user){
  const code = String(Math.floor(100000+Math.random()*900000));
  window.__pendingVerification = {kind, changes, code};
  const bg = document.createElement('div');
  bg.className='modal-bg'; bg.id='verifyModalBg';
  bg.innerHTML = `<div class="modal">
    <h3 style="margin-bottom:10px;">Verificación de identidad</h3>
    <p class="muted" style="font-size:13px; margin-bottom:14px;">Para proteger tu cuenta, confirma este cambio con un código de verificación.</p>
    <div class="field"><label>Enviar código a</label>
      <select id="verifyMethod">
        <option value="email">Correo electrónico${user.email?(' ('+esc(user.email)+')'):''}</option>
        <option value="phone">Teléfono celular${user.telefono?(' ('+esc(user.telefono)+')'):''}</option>
      </select>
    </div>
    <button class="btn btn-outline" style="margin-bottom:14px;" onclick="sendVerificationCode()">Enviar código</button>
    <div class="field"><label>Código de verificación</label><input id="verifyCode" placeholder="6 dígitos" maxlength="6"></div>
    <div style="display:flex; gap:10px; margin-top:6px;">
      <button class="btn btn-outline" onclick="document.getElementById('verifyModalBg').remove()">Cancelar</button>
      <button class="btn btn-gold" onclick="confirmVerificationCode()">Confirmar</button>
    </div>
  </div>`;
  document.body.appendChild(bg);
}
function sendVerificationCode(){
  const method = document.getElementById('verifyMethod').value;
  const pv = window.__pendingVerification;
  if(!pv) return;
  showToast('Código enviado por '+(method==='email'?'correo electrónico':'SMS')+' (simulado): '+pv.code);
}
function confirmVerificationCode(){
  const val = document.getElementById('verifyCode').value.trim();
  const pv = window.__pendingVerification;
  if(!pv) return;
  if(val !== pv.code){ showToast('Código incorrecto. Verifica e intenta de nuevo.', true); return; }
  const user = currentUser();
  const closeModal = ()=>{
    const modal = document.getElementById('verifyModalBg');
    if(modal) modal.remove();
    window.__pendingVerification = null;
  };
  if(pv.kind==='perfil'){
    Object.assign(user, pv.changes);
    saveDB();
    showToast('Información personal actualizada.');
    closeModal();
    render();
  } else {
    auth.currentUser.updatePassword(pv.changes.password).then(()=>{
      showToast('Contraseña actualizada correctamente.');
      closeModal();
      render();
    }).catch(err=>{
      if(err && err.code==='auth/requires-recent-login'){
        showToast('Por seguridad, cierra sesión y vuelve a entrar antes de cambiar tu contraseña.', true);
      } else {
        showToast('No se pudo actualizar la contraseña: '+(err&&err.message?err.message:'error desconocido'), true);
      }
    });
  }
}

function runSimulation(){
  const monto = Number(document.getElementById('simMonto').value);

  const totalPagado = cuota*plazo;
  const totalInteres = totalPagado - monto;
  const user = currentUser();
  const clientId = (user && (user.role==='admin'||user.role==='cajero')) ? STATE.sel.simCliente : null;
  window.__lastSim = {monto, tasa, plazo, cuota, rows, clientId};

  box.innerHTML = `

    <div class="card" style="margin:20px 0 18px; background:var(--surface-2);">
      <div class="muted" style="font-size:12px; margin-bottom:6px;">Cliente</div>
      <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; font-size:13px;">
        <div><b>${esc(client.name)}</b></div>
        <div>DNI: ${esc(client.dni||'—')}</div>
        <div>Tel: ${esc(client.telefono||'—')}</div>

    <div class="grid grid-4" style="margin-bottom:18px;">
      <div class="card kpi"><div class="label">Cuota mensual</div><div class="value">${money(cuota)}</div></div>
      <div class="card kpi"><div class="label">Total a pagar</div><div class="value">${money(totalPagado)}</div></div>
      <div class="card kpi"><div class="label">Total en intereses</div><div class="value gold">${money(totalInteres)}</div></div>
      <div class="card kpi"><div class="label">Plazo</div><div class="value">${plazo} m</div></div>
    </div>
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:10px;">
      <h3 style="font-size:14.5px;">Tabla de amortización</h3>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn btn-outline btn-sm" onclick="printSimulation()">Imprimir</button>
        <button class="btn btn-outline btn-sm" onclick="pdfSimulation()">Guardar PDF</button>
        <button class="btn btn-outline btn-sm" onclick="shareSimulation()">Compartir PDF</button>
        <button class="btn btn-outline btn-sm" onclick="downloadCSV('simulacion_prestamo.csv', [['Cuota','Fecha','Pago','Interés','Capital','Saldo'], ...window.__lastSim.rows.map(r=>[r.n, r.fecha.toISOString().slice(0,10), r.cuota.toFixed(2), r.interes.toFixed(2), r.capital.toFixed(2), r.saldo.toFixed(2)])])">CSV</button>
      </div>
    </div>
    <div class="tablewrap">
      <table>
        <tr><th>#</th><th>Fecha</th><th>Cuota</th><th>Interés</th><th>Capital</th><th>Saldo</th></tr>
        ${rows.map(r=>`<tr><td>${r.n}</td><td>${fmtDate(r.fecha)}</td><td class="num">${money(r.cuota)}</td><td class="num">${money(r.interes)}</td><td class="num">${money(r.capital)}</td><td class="num">${money(r.saldo)}</td></tr>`).join('')}
      </table>
    </div>`;
}
function simulationStatementData(){
  const s = window.__lastSim;
  const client = s.clientId ? userById(s.clientId) : null;
  const infoLines = [
    client ? 'Cliente: '+client.name : 'Cliente: (sin especificar)',
    client && client.dni ? 'DNI: '+client.dni : null,

    'Plazo: '+s.plazo+' meses',

    title:'Simulación de Préstamo',
    infoLines,
    headers:['#','Fecha','Cuota','Interés','Capital','Saldo'],

    filename: 'simulacion_prestamo'+(client?('_'+client.username):'')+'.pdf',
  };
}
function printSimulation(){ printHTML(statementHTML(simulationStatementData())); }

<script>
  const capaSinConexion = document.getElementById('capa-sin-conexion');

  function actualizarEstadoRed() {
    if (navigator.onLine) {
      capaSinConexion.style.display = 'none';
    } else {
      capaSinConexion.style.display = 'flex';
    }
  }

  window.addEventListener('offline', actualizarEstadoRed);
  window.addEventListener('online', actualizarEstadoRed);

  actualizarEstadoRed();
</script>
